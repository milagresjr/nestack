name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Obrigatório para OIDC (trusted publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Staged publishing exige npm >= 11.15.0.
      - run: npm install -g npm@latest

      - run: npm ci

      # O npm detecta o ambiente OIDC e envia a versão para a fila de staging.
      # Um mantenedor precisa aprovar (com 2FA) para a versão ficar disponível.
      - run: npm stage publish
